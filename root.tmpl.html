<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotst</title>
</head>
<body>
    <h1>gotst</h1>
    <p>Started at {{ .StartedAt }} ({{ .StartedAgo }})</p>
    <p>Phase: {{ .Phase }}</p>

    <h2>Packages</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <tr style="text-align: left;">
            <th>Package</th>
            <th>Tests</th>
            <th>Status</th>
        </tr>
        {{ range .Packages }}
        <tr>
            <td>{{ .ImportPath }}</a></td>
            <td>{{ .HasTests }}</td>
            <td>{{ .Status }}</td>
        </tr>
        {{ end }}
    </table>
    <script src="/live.js"></script>
</body>
</html>
